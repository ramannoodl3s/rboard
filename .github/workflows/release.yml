# Pushing a version tag (e.g. v0.2.0) builds the portable zip on Windows
# and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements/build.txt

      - name: Build the portable zip
        id: build
        shell: pwsh
        run: |
          $zip = .\packaging\build.ps1 -Python python
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zip }}
          generate_release_notes: true
          body: |
            **Download:** `R-Board-…-portable.zip` below, unzip it anywhere and run `R Board.exe`. Nothing needs installing.

            The first time, Windows may say "Windows protected your PC" (the app isn't signed): click **More info**, then **Run anyway**.

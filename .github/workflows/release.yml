# Pushing a version tag (e.g. v0.3.0) builds the portable zip and the AI
# features plugin on Windows and publishes them as a GitHub release. Use an
# annotated tag: its message becomes the patch notes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements/build.txt

      - name: Build the portable zip
        id: build
        shell: pwsh
        run: |
          $zip = .\packaging\build.ps1 -Python python
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Release notes
        shell: bash
        run: |
          # The tag's message (git tag -a v1.2.3 -m "...") goes on top
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          echo >> notes.md
          cat .github/release-body.md >> notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body_path: notes.md

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beeref*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.png"]

[project]
name = "BeeRef"
version = "0.3.4-dev"
description = "A simple reference image viewer"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
    # R Board
    "numpy>=1.26",
    "playwright==1.58.0",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Globalization; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
]

[project.gui-scripts]
beeref = "beeref.__main__:main"
rboard = "beeref.__main__:main"

[project.urls]
Homepage = "https://beeref.org/"
Repository = "https://github.com/rbreu/beeref"
# Documentation =
Issues = "https://github.com/rbreu/beeref/issues"
Changelog = "https://github.com/rbreu/beeref/blob/main/CHANGELOG.rst"
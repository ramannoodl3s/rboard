[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beeref*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.png", "*.json", "*.npz"]

[project]
name = "RBoard"
version = "0.3.0"
description = "A moodboard app, based on the BeeRef reference image viewer"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "Rebecca Breu", email = "rebecca@rbreu.de" },
]
requires-python = ">=3.9,<3.13"
dependencies = [
    "exif>=1.3.5,<=1.6.0",
    "lxml==5.1.0",
    "pyQt6-Qt6>=6.7.0,<=6.7.0",
    "pyQt6>=6.7.0,<=6.7.0",
    "rectangle-packer>=2.0.1,<=2.0.2",
    # R Board
    "numpy>=1.26",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Globalization; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The AI features plugin's libraries (plugins/ai); the portable app
# downloads them as a plugin instead
ai = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[project.gui-scripts]
rboard = "beeref.__main__:main"

[project.urls]
Repository = "https://github.com/ramannoodl3s/rboard"
BeeRef = "https://github.com/rbreu/beeref"
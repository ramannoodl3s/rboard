<!-- @dsCard group="Panels" height=400 subtitle="boards panel, properties panel" -->
<style>body{margin:0}</style>
<div class="sc-stage"><div class="sc-flex" style="align-items:flex-start;gap:var(--space-4)">
<div class="sc-panel">
<div class="sc-panel__head"><span class="sc-title">boards</span><button class="sc-iconbtn sc-iconbtn--sm" aria-label="new board"><span data-icon="plus" data-size="16"></span></button></div>
<div class="sc-panel__body">
<div class="sc-field" style="margin-bottom:var(--space-2)"><span data-icon="search" data-size="16"></span><input placeholder="search" /></div>
<div class="sc-row" aria-selected="true"><span class="sc-thumb" style="background:linear-gradient(135deg,var(--palette-orange),var(--palette-yellow))"></span><span>cover refs</span><span class="sc-row__count">24</span></div>
<div class="sc-row"><span class="sc-thumb" style="background:linear-gradient(135deg,var(--palette-lime),var(--palette-teal))"></span><span>tunnels</span><span class="sc-row__count">118</span></div>
<div class="sc-row"><span class="sc-thumb" style="background:linear-gradient(135deg,var(--palette-sky),var(--palette-magenta))"></span><span>gear</span><span class="sc-row__count">41</span></div>
<div class="sc-row"><span class="sc-thumb" style="background:linear-gradient(135deg,var(--palette-violet),var(--palette-teal))"></span><span>type specimens</span><span class="sc-row__count">63</span></div>
</div>
<div class="sc-panel__section"><span class="sc-label">labels</span></div>
<div class="sc-panel__body" style="flex-direction:row;flex-wrap:wrap;gap:var(--space-1)"><span class="sc-tag" style="--dot:var(--palette-teal)"><i></i>water</span><span class="sc-tag" style="--dot:var(--palette-orange)"><i></i>type</span><span class="sc-tag" style="--dot:var(--palette-sky)"><i></i>blue</span></div>
</div>
<div class="sc-panel">
<div class="sc-panel__head"><span class="sc-title">image</span><button class="sc-iconbtn sc-iconbtn--sm" aria-label="close"><span data-icon="close" data-size="16"></span></button></div>
<div class="sc-panel__body" style="gap:var(--space-3);padding:var(--space-4)">
<div class="sc-fieldrow" style="grid-template-columns:72px 1fr"><span class="sc-muted">opacity</span><div class="sc-slider"><div class="sc-slider__track"></div><div class="sc-slider__fill" style="width:100%"></div><div class="sc-slider__thumb" style="left:100%"></div></div></div>
<div class="sc-fieldrow" style="grid-template-columns:72px 1fr"><span class="sc-muted">width</span><div class="sc-field"><input value="640 px" /></div></div>
<div class="sc-fieldrow" style="grid-template-columns:72px 1fr"><span class="sc-muted">lock</span><span class="sc-switch" role="switch" aria-checked="false"></span></div>
<div class="sc-flex" style="gap:var(--space-2)"><button class="sc-btn sc-fill"><span data-icon="flip-h" data-size="16"></span>flip</button><button class="sc-btn sc-fill"><span data-icon="grayscale" data-size="16"></span>gray</button></div>
</div></div>
</div></div>
<script>if(window.Softclub){Softclub.mount();}</script>

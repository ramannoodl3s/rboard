<!-- @dsCard group="Controls" height=300 subtitle="text field, slider, switch, checkbox, segmented" -->
<style>body{margin:0}</style>
<div class="sc-stage sc-stage--surface"><div class="sc-col" style="max-width:380px;gap:var(--space-4)">
<div class="sc-field"><span data-icon="search" data-size="16"></span><input placeholder="search boards" /></div>
<div class="sc-field is-focus"><input value="cover refs" /></div>
<div class="sc-fieldrow"><span class="sc-muted">opacity</span><div class="sc-slider"><div class="sc-slider__track"></div><div class="sc-slider__fill" style="width:70%"></div><div class="sc-slider__thumb" style="left:70%"></div></div></div>
<div class="sc-fieldrow"><span class="sc-muted">snap to grid</span><span class="sc-switch" role="switch" aria-checked="true"></span></div>
<div class="sc-fieldrow"><span class="sc-muted">always on top</span><span class="sc-switch" role="switch" aria-checked="false"></span></div>
<div class="sc-fieldrow"><span class="sc-muted">options</span><div class="sc-flex" style="gap:var(--space-4)"><span class="sc-opt"><span class="sc-check" role="checkbox" aria-checked="true"><span data-icon="check" data-size="12"></span></span>names</span><span class="sc-opt"><span class="sc-check" role="checkbox" aria-checked="false"></span>guides</span></div></div>
<div class="sc-fieldrow"><span class="sc-muted">fit</span><div class="sc-seg"><button aria-pressed="true">window</button><button aria-pressed="false">fill</button><button aria-pressed="false">1:1</button></div></div>
</div></div>
<script>if(window.Softclub){Softclub.mount();}</script>

<!-- @dsCard group="Foundations" height=330 subtitle="28 symbols, 16px grid, 1.5px stroke" -->
<style>body{margin:0}</style>
<div class="sc-stage sc-stage--surface"><div id="g" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-3)"></div></div>
<script>var g=document.getElementById('g');if(window.Softclub){Object.keys(Softclub.icons).forEach(function(n){var d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border:1px solid var(--divider);border-radius:var(--radius-md);color:var(--ink)';d.innerHTML=Softclub.icon(n,24)+'<span class="sc-caption">'+n+'</span>';g.appendChild(d);});}if(window.Softclub){Softclub.mount();}</script>
